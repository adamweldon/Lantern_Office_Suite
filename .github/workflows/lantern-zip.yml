# Lantern.zip -- on every push to main, pack the Lantern folder
# (tools/make_lantern_zip.py) and put it on the release for this version, marked
# Latest. So a push is an update anyone can lay over their Lantern folder, and
# this link always gives the newest:
#   https://github.com/adamweldon/Lantern_Office_Suite/releases/latest/download/Lantern.zip
# From 1.24.19 the release also carries the one-link starter, built for every
# computer (tools/pack_starter.py), and these links always give the newest:
#   .../releases/latest/download/Get-Lantern.exe          Windows
#   .../releases/latest/download/Get-Lantern-Mac.zip      a Mac (Lantern.app)
#   .../releases/latest/download/Get-Lantern-Linux-x64    Linux (and -arm64)
# The starter fetches Lantern.zip by the link above, so it needs no rebuild
# for a new Lantern; it is rebuilt with each release all the same.
# And the website (GitHub Pages, the gh-pages branch) is made the same
# version, so the link to share works for everyone:
#   https://adamweldon.github.io/Lantern_Office_Suite/get.html
# (Before 1.24.19 gh-pages was copied from site/ by hand, and stood at 1.13.0.)
# A new version number (package.json) makes a new release, v<version>; a push
# with the same number replaces that release's Lantern.zip. The packer stops,
# and nothing is published, when the built files disagree about the version.
name: Lantern.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lantern-zip
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack the Lantern folder
        run: python3 tools/make_lantern_zip.py dist

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build the starter for every computer
        run: python3 tools/pack_starter.py dist/get

      - name: Publish Lantern.zip on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/Lantern.zip dist/get/Get-Lantern* --clobber
            gh release edit "v$V" --notes-file dist/notes.md --latest
          else
            gh release create "v$V" dist/Lantern.zip dist/get/Get-Lantern* --target "$GITHUB_SHA" \
              --title "Lantern $V" --notes-file dist/notes.md --latest
          fi
          echo "Lantern $V: $(gh release view "v$V" --json url --jq .url)"

      - name: The website (gh-pages) the same version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          rm -rf /tmp/pages && cp -r site /tmp/pages && cd /tmp/pages && touch .nojekyll
          git init -q -b gh-pages
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "Lantern $V website (site/ of $GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "gh-pages: Lantern $V; https://adamweldon.github.io/Lantern_Office_Suite/get.html"
