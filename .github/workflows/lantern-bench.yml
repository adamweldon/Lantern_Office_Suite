# Lantern Bench with the small models -- every push to a lantern-x.y.z branch
# sets Lantern up on a GitHub computer the way a person does (the kit's own
# installer: the same engine build and the same model files), starts it with
# kit/start-lantern.sh, and runs the whole bench in a headless browser
# (tools/bench_headless.py), once for each model: 0.8B, 2B and 4B.
#
# Why: the aim is that a small model on an old computer gets the right
# answer. The only real-model runs before this were on one laptop with the
# 35B. Here every version is asked the same questions by the models most
# people will actually have, with nobody needing to be at a keyboard.
#
# What it says: the job's summary page has the score, the sets and the failed
# questions; the artifact lantern-bench-<model> has report.json (the same
# file as the AI tile's Save JSON), failed.json (the failed rows as the model
# wrote them, for tests/fixtures) and the start window's text. The job's log
# has the summary and the failed rows too (one line of JSON each), and the
# engine's own complaints, for a session that can read logs but not artifacts.
# A job is green when the run FINISHED, whatever it scored: the score is a
# measurement, not a gate. Nothing here publishes anything or writes to the
# repository.
#
# A GitHub computer for a public repository has 4 processor cores and 16 GB
# of memory and no graphics card, so the speeds here are an old laptop's.
# The offline library is not set up (12 GB), so the encyclopedia questions
# are left out, as the summary says.
#
# By hand (Actions tab, Run workflow): choose the models, "quick", "full" or
# a pattern for the question ids (for example ^make-music), and the prompt
# size (auto, short or full: to compare a model both ways).
name: Lantern Bench

# (A push that creates a branch is judged by the new commits it brings and
# the files they change: lantern-1.24.8 was first pushed with an empty
# version commit on top, and lantern-1.24.9 with commits already pushed to
# a wip- branch, and neither started a run; nor can a session start one by
# hand. So a version branch is pushed with a commit of its own that changes
# something outside the paths below.)
on:
  push:
    branches: ['lantern-*']
    paths-ignore: ['agent/**', 'docs/**', 'README.md', 'CLAUDE.md']
  workflow_dispatch:
    inputs:
      models:
        description: 'Models, separated by spaces: 0.8b 2b 4b 9b'
        default: '0.8b 2b 4b'
      questions:
        description: 'quick, full, or a pattern for question ids'
        default: 'full'
      prompt:
        description: 'Prompt size: auto (short for a model under 3B), short, or full'
        default: 'auto'

permissions:
  contents: read

concurrency:
  group: lantern-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.list }}
    steps:
      - id: models
        env:
          ASKED: ${{ github.event.inputs.models }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          asked = (os.environ.get("ASKED") or "0.8b 2b 4b").lower().split()
          known = ["0.8b", "2b", "4b", "9b"]
          print("list=" + json.dumps([m for m in known if m in asked] or ["0.8b", "2b", "4b"]))
          EOF

  bench:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.plan.outputs.models) }}
    env:
      MODEL_ID: ${{ matrix.model }}
      QUESTIONS: ${{ github.event.inputs.questions }}
      PROMPT: ${{ github.event.inputs.prompt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Which processor the run got (1.24.8). On 1.24.7 the 4B and the 2B took
      # about 2.4 times as long on every question as on 1.24.6, short ones as
      # much as long ones, and the 0.8B did not: GitHub's computers are not
      # all the same. A run's minutes are read with this line.
      - name: The computer this run is on
        run: |
          {
            echo "Processor: $(grep -m1 'model name' /proc/cpuinfo | sed 's/^[^:]*: *//')"
            echo "Processors: $(nproc); memory: $(free -m | awk '/^Mem:/ {print $2}') MB"
            echo "Instructions: $(grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'avx512f|avx2|fma|f16c' | sort -u | tr '\n' ' ')"
          } | tee computer.txt

      - name: Get the engine and the model with the kit's own installer
        env:
          LANTERN_AUTO_DOWNLOAD: 1
        run: sh kit/setup-kit.sh engine "$MODEL_ID"

      - name: Start Lantern the way a person does
        env:
          NO_BROWSER: 1
          LANTERN_AUTO_DOWNLOAD: 0
        run: |
          nohup sh kit/start-lantern.sh "$MODEL_ID" nodownload > start-lantern.log 2>&1 &
          sleep 5; cat start-lantern.log

      - name: A browser for the bench
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Run the bench
        run: |
          case "${QUESTIONS:-full}" in
            full|"") python3 tools/bench_headless.py --out bench-out --label "$MODEL_ID" --minutes 320 --prompt "${PROMPT:-auto}" ;;
            quick)   python3 tools/bench_headless.py --out bench-out --label "$MODEL_ID" --minutes 320 --prompt "${PROMPT:-auto}" --quick ;;
            *)       python3 tools/bench_headless.py --out bench-out --label "$MODEL_ID" --minutes 320 --prompt "${PROMPT:-auto}" --match "$QUESTIONS" ;;
          esac

      - name: The summary
        if: always()
        run: |
          if [ -f bench-out/summary.md ]; then cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f computer.txt ]; then { echo; cat computer.txt; } >> "$GITHUB_STEP_SUMMARY"; echo "--- the computer ---"; cat computer.txt; fi
          # The job's log is all a session may be able to read (the artifact
          # store is another site), so what matters of the start window goes here.
          echo "--- the start window: how it began ---"; head -n 60 start-lantern.log || true
          echo "--- the start window: what the engine refused or failed (first 40 lines) ---"
          grep -n -i -E 'error|exceed|invalid|failed|unsupported' start-lantern.log | head -n 40 || true
          echo "--- the start window: how it ended ---"; tail -n 12 start-lantern.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-bench-${{ matrix.model }}
          path: |
            bench-out
            start-lantern.log
            computer.txt
          retention-days: 90
